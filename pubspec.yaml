name: one_twenty_one
description: A Flutter implementation of the 121 care dashboard.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cupertino_icons: ^2.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/icons/
    - assets/backgrounds/
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
        - asset: assets/fonts/InstrumentSans-Italic.ttf
          style: italic
    - family: Family
      fonts:
        - asset: assets/fonts/Family-Light.ttf
          weight: 300
